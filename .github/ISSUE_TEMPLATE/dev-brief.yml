name: Dev Brief
description: Specification for the dev agent to implement
title: "[Brief]: "
labels: ["dev-brief"]
body:
  - type: markdown
    attributes:
      value: |
        📄 **Product scope is canonical** — site-agnostic product for arbitrary single-site **and** multisite WordPress; our sites are an incidental test environment, never the fix scope; site-coupled behavior is a defect; multisite is first-class. See [`docs/PRODUCT-SCOPE.md`](../docs/PRODUCT-SCOPE.md).
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be built and why
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Technical specification
      description: Detailed implementation spec
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files to create/modify
      description: Which files will be affected
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing plan
      description: How to verify the implementation works
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Any security implications or requirements
  - type: input
    id: assigned
    attributes:
      label: Assigned to
      placeholder: "Dev agent"
    validations:
      required: true
