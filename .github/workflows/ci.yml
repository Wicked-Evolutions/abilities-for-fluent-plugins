name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # `integration/**` covers long-lived integration branches used for bundled
    # multi-PR releases (e.g. integration/fluent-suite-registrar-v2 for the
    # Fluent Suite Registrar Bundle Sprint). Phase B per-plugin feature PRs
    # target their integration branch, so without this glob those PRs would
    # have no CI runs.
    branches: [main, "integration/**"]

jobs:
  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # composer.lock pins phpunit 10.5.x and sebastian/* which require PHP 8.1+.
      # composer.json's "php": ">=7.4" is the *production* minimum (what
      # WordPress sites running this plugin must have); the dev/test toolchain
      # minimum tracks the lockfile.
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Unit Tests
        run: vendor/bin/phpunit --testsuite Unit

  build-release-zip:
    name: Build Release ZIP
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --prefer-dist --no-dev --optimize-autoloader

      - name: Build release ZIP
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          SLUG="abilities-for-fluent-plugins"
          ZIP_NAME="${SLUG}-${VERSION}.zip"
          mkdir -p "/tmp/${SLUG}"
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' \
            --exclude='bin' --exclude='*.xml.dist' --exclude='.gitignore' \
            --exclude='composer.json' --exclude='composer.lock' \
            --exclude='.DS_Store' \
            . "/tmp/${SLUG}/"
          cd /tmp
          zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${SLUG}/"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIP_NAME }}
